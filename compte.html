<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compte - CHIDRA FREE SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--electric:#1A6BFF;--lime:#C8FF00;--noir:#0A0A0A;--blanc:#FAFAF8;--gris:#1C1C1C;--muted:#888;--radius:14px;}
  body{font-family:'Space Grotesk',sans-serif;background:var(--blanc);color:var(--noir);overflow-x:hidden}
  nav{background:var(--noir);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:64px;position:sticky;top:0;z-index:100;border-bottom:1px solid #222;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--blanc);letter-spacing:2px}
  .nav-links{display:flex;gap:1.5rem;list-style:none}
  .nav-links a{color:#aaa;text-decoration:none;font-size:.85rem;font-weight:500;letter-spacing:.5px;transition:color .2s}
  .nav-links a:hover{color:var(--lime)}
  .container{max-width:960px;margin:0 auto;padding:2rem}
  .header{margin-bottom:1.5rem}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:1px;margin-bottom:.5rem}
  .header p{color:#666;line-height:1.8}
  .auth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem}
  .card{background:var(--gris);color:#fff;border-radius:24px;padding:2rem;border:1px solid #222;margin-bottom:1.5rem}
  .card h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;margin-bottom:1rem}
  .form-group{display:grid;gap:.35rem;margin-bottom:1rem}
  .form-group label{font-size:.85rem;color:#ccc}
  .form-group input{width:100%;padding:1rem;border-radius:14px;border:1px solid #333;background:#101010;color:#fff;font-family:inherit}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .button-row{display:flex;gap:1rem;flex-wrap:wrap;margin-top:1rem}
  .btn{background:var(--electric);color:#fff;border:none;padding:1rem 1.4rem;border-radius:14px;font-weight:700;cursor:pointer;transition:background .2s}
  .btn:hover{background:#1558d0}
  .secondary-btn{background:#444;}
  .status{color:var(--lime);font-size:.95rem;margin-top:.75rem}
  .text-btn{display:block;margin-top:.8rem;padding:0;background:none;border:0;color:var(--lime);cursor:pointer;font:inherit;font-size:.85rem;text-decoration:underline}
  .forgot-box{margin-top:1rem;padding-top:1rem;border-top:1px solid #333}
  .account-box{background:#111;border:1px solid #222;border-radius:20px;padding:1.5rem;}
  .account-box div{margin-bottom:.8rem}
  .account-box label{color:#aaa;font-size:.85rem}
  .account-box strong{display:block;margin-top:.35rem;font-size:1rem;color:#fff}
  .footer-link{display:block;text-align:center;padding:2rem;color:#aaa;text-decoration:none}
  @media(max-width:768px){
    .form-row,.auth-grid{grid-template-columns:1fr}
    .container{padding:1.25rem}
    .card{padding:1.5rem;border-radius:18px}
  }
</style>
</head>
<body>
<nav>
  <div class="logo">CHIDRA FREE SHOP</div>
  <ul class="nav-links">
    <li><a href="Chidra Free Shop.html">Accueil</a></li>
    <li><a href="collections.html">Collections</a></li>
    <li><a href="nouveautes.html">Nouveautés</a></li>
    <li><a href="apropos.html">À propos</a></li>
    <li><a href="services.html">Services</a></li>
    <li id="adminNavItem" class="is-hidden"><a href="admin.html">Admin</a></li>
    <li><a id="accountNavLink" href="compte.html">Compte</a></li>
  </ul>
</nav>
<div class="container">
  <div class="header">
    <h1>Mon compte</h1>
    <p>Crée ton compte ou connecte-toi pour accéder à ton espace personnel et suivre tes commandes.</p>
  </div>
  <div class="auth-grid">
  <div class="card">
    <h2>Accès au compte</h2>
    <div class="form-row">
      <div>
        <h2>Connexion</h2>
        <div class="form-group"><label for="loginEmail">Email</label><input id="loginEmail" type="email"></div>
        <div class="form-group"><label for="loginPassword">Mot de passe</label><input id="loginPassword" type="password"></div>
        <button id="loginBtn" class="btn">Se connecter</button><div id="loginStatus" class="status"></div>
        <button id="forgotPasswordBtn" class="text-btn" type="button">Mot de passe oublié ?</button>
        <div id="forgotPasswordBox" class="forgot-box is-hidden"><div class="form-group"><label for="forgotEmail">Email du compte</label><input id="forgotEmail" type="email"></div><div class="form-group"><label for="forgotNewPassword">Nouveau mot de passe</label><input id="forgotNewPassword" type="password"></div><button id="resetPasswordBtn" class="btn" type="button">Réinitialiser</button><div id="forgotStatus" class="status"></div></div>
      </div>
      <div>
        <h2>Créer un compte</h2>
        <div class="form-group"><label for="signupName">Nom</label><input id="signupName" type="text"></div>
        <div class="form-group"><label for="signupEmail">Email</label><input id="signupEmail" type="email"></div>
        <div class="form-group"><label for="signupPassword">Mot de passe</label><input id="signupPassword" type="password"></div>
        <button id="signupBtn" class="btn secondary-btn">Créer un compte</button><div id="signupStatus" class="status"></div>
      </div>
    </div>
  </div>
  <div class="card account-box is-hidden" id="profileBox">
    <h2>Profil</h2>
    <div><label>Utilisateur</label><strong id="profileName"></strong></div>
    <div><label>Email</label><strong id="profileEmail"></strong></div>
    <div><label>Rôle</label><strong id="profileRole"></strong></div>
    <button id="logoutBtn" class="btn secondary-btn">Se déconnecter</button>
  </div>
</div>
<a class="footer-link" href="Chidra Free Shop.html">← Retour à l'accueil</a>
<script src="common.js"></script>
<script>
  const loginEmail = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');
  const loginStatus = document.getElementById('loginStatus');
  const signupName = document.getElementById('signupName');
  const signupEmail = document.getElementById('signupEmail');
  const signupPassword = document.getElementById('signupPassword');
  const signupStatus = document.getElementById('signupStatus');
  const profileBox = document.getElementById('profileBox');
  const profileName = document.getElementById('profileName');
  const profileEmail = document.getElementById('profileEmail');
  const profileRole = document.getElementById('profileRole');
  const logoutBtn = document.getElementById('logoutBtn');
  const forgotPasswordBox = document.getElementById('forgotPasswordBox');
  const forgotEmail = document.getElementById('forgotEmail');
  const forgotNewPassword = document.getElementById('forgotNewPassword');
  const forgotStatus = document.getElementById('forgotStatus');

  function ensureDefaultAdmin() {
    const users = getStoredUsers();
    const adminExists = users.some(u => u.email === 'admin@chidra.com');
    if(!adminExists){
      users.push({name:'Admin',email:'admin@chidra.com',password:'admin123',role:'admin'});
      saveStoredUsers(users);
    }
  }

  function validateEmail(email){ return email && email.includes('@'); }

  function setStatus(el,message,color){ el.textContent = message; if(color) el.style.color = color; }

  function renderProfile(user){
    if(!user){ profileBox.classList.add('is-hidden'); return; }
    profileBox.classList.remove('is-hidden');
    profileName.textContent = user.name || 'Utilisateur';
    profileEmail.textContent = user.email;
    profileRole.textContent = user.role;
  }

  function loadProfile(){
    const user = getCurrentUser();
    if(getQueryParam('logout') === '1'){
      logoutCurrentUser();
      window.location.href = 'compte.html';
      return;
    }
    if(user?.role === 'admin'){
      window.location.href = 'admin.html';
      return;
    }
    renderProfile(user);
  }

  function createUser(name,email,password){
    const users = getStoredUsers();
    if(users.some(u => u.email === email)) return null;
    const role = (email==='admin@chidra.com' && password==='admin123') ? 'admin' : 'customer';
    const user = {name, email, password, role};
    users.push(user);
    saveStoredUsers(users);
    return user;
  }

  function loginUser(email,password){
    const users = getStoredUsers();
    return users.find(u => u.email===email && u.password===password) || null;
  }

  forgotPasswordBtn.addEventListener('click', () => {
    forgotPasswordBox.classList.toggle('is-hidden');
    forgotStatus.textContent = '';
  });

  resetPasswordBtn.addEventListener('click', () => {
    const email = forgotEmail.value.trim().toLowerCase();
    const password = forgotNewPassword.value.trim();
    if(!validateEmail(email) || password.length < 6){
      setStatus(forgotStatus,'Email valide et mot de passe de 6 caractères minimum requis','var(--lime)');
      return;
    }
    const users = getStoredUsers();
    const user = users.find(item => item.email.toLowerCase() === email);
    if(!user){ setStatus(forgotStatus,'Aucun compte trouvé avec cet email','red'); return; }
    user.password = password;
    saveStoredUsers(users);
    setStatus(forgotStatus,'Mot de passe réinitialisé. Tu peux te connecter.','var(--lime)');
    forgotEmail.value = '';
    forgotNewPassword.value = '';
    forgotPasswordBox.classList.add('is-hidden');
  });

  loginBtn.addEventListener('click', () => {
    const email = loginEmail.value.trim();
    const password = loginPassword.value.trim();
    if(!validateEmail(email) || !password){ setStatus(loginStatus,'Email et mot de passe requis','var(--lime)'); return; }
    const user = loginUser(email,password);
    if(!user){ setStatus(loginStatus,'Identifiants incorrects','red'); return; }
    setCurrentUser(user);
    setStatus(loginStatus,'Connecté avec succès','var(--lime)');
    renderProfile(user);
    redirectAfterLogin();
  });

  signupBtn.addEventListener('click', () => {
    const name = signupName.value.trim();
    const email = signupEmail.value.trim();
    const password = signupPassword.value.trim();
    if(!name || !validateEmail(email) || !password){ setStatus(signupStatus,'Tous les champs sont requis','var(--lime)'); return; }
    const user = createUser(name,email,password);
    if(!user){ setStatus(signupStatus,'Email déjà utilisé','red'); return; }
    setCurrentUser(user);
    setStatus(signupStatus,'Compte créé avec succès','var(--lime)');
    renderProfile(user);
    redirectAfterLogin();
  });

  logoutBtn.addEventListener('click', () => {
    logoutCurrentUser();
    renderProfile(null);
    window.location.href = 'compte.html';
  });

  function redirectAfterLogin(){
    const redirect = getQueryParam('redirect');
    if(redirect){ window.location.href = redirect; return; }
    const user = getCurrentUser();
    if(user?.role === 'admin'){ window.location.href = 'admin.html'; return; }
    window.location.href = 'Chidra Free Shop.html';
  }

  ensureDefaultAdmin();
  loadProfile();
</script>
</body>
</html>
