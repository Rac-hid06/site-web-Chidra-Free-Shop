server.port=${PORT:8080}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chidra-shop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Chidra Free Shop}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://site-web-chidra-free-shop.vercel.app,http://localhost:5500,http://127.0.0.1:5500}
